# Configuracion de pruebas para Comercial (base aislada urleads_comercial_test)
spring.application.name=comercial-service-test

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urleads_comercial_test}}
spring.datasource.username=${DB_USERNAME:urleads_app}
spring.datasource.password=${DB_PASSWORD:sql}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

comercial.security.jwt.public-key-location=classpath:keys/crm-public.pem
comercial.security.jwt.issuer=urleads-crm
comercial.security.jwt.audience=comercial-api
comercial.security.jwt.required-scope=comercial.access

eureka.client.enabled=false

# OpenFeign & CRM Client
crm.service.url=${CRM_SERVICE_URL:}
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
spring.cloud.openfeign.client.config.crm-service.connect-timeout=2000
spring.cloud.openfeign.client.config.crm-service.read-timeout=3000

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.crmService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.crmService.sliding-window-size=5
resilience4j.circuitbreaker.instances.crmService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.crmService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.crmService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.crmService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.crmService.record-exceptions=java.lang.Throwable
resilience4j.circuitbreaker.instances.crmService.ignore-exceptions=com.urleads.comercial.client.exception.CrmAuthenticationException,com.urleads.comercial.client.exception.CrmForbiddenException,com.urleads.comercial.exception.ResourceNotFoundException

