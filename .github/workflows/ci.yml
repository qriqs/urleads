name: CI

on:
  pull_request:
    branches:
      - main
      - integration/backend-v2
  push:
    branches:
      - main
      - integration/backend-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: urleads_test
          POSTGRES_USER: urleads_test_user
          POSTGRES_PASSWORD: urleads_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urleads_test_user -d urleads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun 1.3.10
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Verify integrated application
        env:
          COOKIE_SECURE: false
          TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/urleads_test
          TEST_DB_USERNAME: urleads_test_user
          TEST_DB_PASSWORD: urleads_test_password
          DB_URL: jdbc:postgresql://127.0.0.1:5432/urleads_test
          DB_USERNAME: urleads_test_user
          DB_PASSWORD: urleads_test_password
        run: ./scripts/build.sh -Pdb-integration

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun 1.3.10
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Type-check frontend
        working-directory: frontend
        run: bun run lint

      - name: Build frontend
        working-directory: frontend
        run: bun run build
