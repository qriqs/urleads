# Identificador y puerto del servicio Agenda (UrLeads Backend V2)
spring.application.name=${SPRING_APPLICATION_NAME:agenda-service}
server.port=${PORT:8082}

# Base de datos principal (Produccion / Desarrollo local)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urleads}}
spring.datasource.username=${DB_USERNAME:urleads_app}
spring.datasource.password=${DB_PASSWORD:sql}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Configuracion de cookie de sesion segura para produccion
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# JWT Configuration
jwt.secret=${JWT_SECRET:urleads-backend-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
jwt.issuer=${JWT_ISSUER:urleads}
jwt.audience=${JWT_AUDIENCE:urleads}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:false}
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# CRM Inter-service Client Configuration
crm.base-url=${CRM_BASE_URL:http://localhost:8080}

# SpringDoc OpenAPI 3 / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method

# Descubrimiento de servicios (Eureka Client)
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}



