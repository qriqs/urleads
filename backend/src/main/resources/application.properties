# Identificador de aplicacion Backend V2
spring.application.name=crm-service

# Puerto de la aplicacion (configurable por entorno, defecto 8080)
server.port=${PORT:8080}

# Descubrimiento Eureka (desactivado por defecto para perfil local/aislado y tests)
eureka.client.enabled=false

# Base de datos principal (Produccion / Desarrollo local)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urleads}}
spring.datasource.username=${DB_USERNAME:urleads_app}
spring.datasource.password=${DB_PASSWORD:sql}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Configuracion de cookie de sesion segura para produccion
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Configuracion JWT Backend V2 C02
urleads.jwt.enabled=${JWT_ENABLED:false}
urleads.jwt.issuer=urleads-crm
urleads.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:classpath:keys/crm-private.pem}
urleads.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:classpath:keys/crm-public.pem}

# Configuracion RabbitMQ Backend V2 C04
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Configuracion Outbox Publisher Backend V2 C04
urleads.outbox.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:true}
urleads.outbox.publisher.interval-ms=${OUTBOX_PUBLISHER_INTERVAL_MS:5000}
urleads.outbox.publisher.batch-size=${OUTBOX_PUBLISHER_BATCH_SIZE:20}
urleads.outbox.publisher.max-retries=${OUTBOX_PUBLISHER_MAX_RETRIES:3}
urleads.outbox.publisher.confirm-timeout-ms=${OUTBOX_PUBLISHER_CONFIRM_TIMEOUT_MS:3000}
urleads.outbox.publisher.base-backoff-seconds=${OUTBOX_PUBLISHER_BASE_BACKOFF_SECONDS:5}

# Springdoc OpenAPI 3 / Swagger UI (Backend V2 C05)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Limites de subida multipart para importacion Excel (Backend V2 C10)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Secreto para firma y cifrado de token de vista previa (Backend V2 C10)
urleads.import.token-secret=${URLEADS_IMPORT_TOKEN_SECRET:}

# Preserve main's Agenda listener/client configuration alongside CRM.
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:false}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
crm.base-url=${CRM_BASE_URL:http://localhost:8080}
jwt.secret=${JWT_SECRET:urleads-backend-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
jwt.issuer=${JWT_ISSUER:urleads}
jwt.audience=${JWT_AUDIENCE:urleads}
