# Configuracion de servidor y aplicacion
server.port=${PORT:8080}
spring.application.name=urleads-backend

# Configuracion de base de datos PostgreSQL con valores por defecto locales
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urleads_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de migraciones Flyway
spring.flyway.enabled=true

# Seguridad de la cookie de sesion JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
spring.flyway.enabled=true
