spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/urleads_test}
spring.datasource.username=${TEST_DB_USERNAME:urleads_app}
spring.datasource.password=${TEST_DB_PASSWORD:sql}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true