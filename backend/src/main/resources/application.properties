# Configuracion de servidor y aplicacion
server.port=${PORT:8080}
spring.application.name=urleads-backend

# Configuracion de base de datos PostgreSQL con valores por defecto locales
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urleads_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de migraciones Flyway
spring.flyway.enabled=true

# TEMPORAL: pendiente de autenticacion real (bloqueo de integracion con Alex)
urleads.auth.temporary-user-id=51