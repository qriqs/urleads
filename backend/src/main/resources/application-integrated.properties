# Perfil integrado: registro y descubrimiento activo con servidor Eureka
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://discovery:8761/eureka/}

# RabbitMQ en entorno integrado Docker Compose
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
